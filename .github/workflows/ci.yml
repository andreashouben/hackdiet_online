name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The build also runs `perl -c` on both CGI programs
      - name: Build image
        run: docker build -t hackdiet:ci .

      # No secrets passed: the entrypoint has to generate them
      - name: Start container
        run: docker run -d --name hackdiet -p 8080:80 hackdiet:ci

      - name: Wait for healthy
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' hackdiet)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          echo "Container is '$status', not healthy" >&2
          exit 1

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080

      - name: Secrets were generated
        run: docker exec hackdiet test -s /server/pub/hackdiet/.secrets/badge_key -a -s /server/pub/hackdiet/.secrets/salt

      - name: Smoke test with registration closed
        run: |
          docker run -d --name hackdiet-closed -p 8081:80 \
            -e HDIET_REGISTRATION=closed hackdiet:ci
          for i in $(seq 1 45); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' hackdiet-closed)" = healthy ] && break
            sleep 1
          done
          EXPECT_REGISTRATION=closed scripts/smoke-test.sh http://localhost:8081

      - name: Check logs for Perl errors
        run: |
          if docker logs hackdiet 2>&1 | grep -E "Premature end of script headers|Can't locate|compilation aborted"; then
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs hackdiet

  publish:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
