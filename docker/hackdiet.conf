<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /server/web

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # Only the two CGI programs are exposed; HDiet/*.pm stays private.
    ScriptAliasMatch ^/cgi-bin/(HackDiet|HackDietBadge)(/.*)?$ /server/bin/httpd/cgi-bin/$1$2
    <Directory /server/bin/httpd/cgi-bin>
        Options +ExecCGI
        Require all granted
        # Modern Perl no longer has "." in @INC
        SetEnv PERL5LIB /server/bin/httpd/cgi-bin
        # Secrets and settings from the environment (see entrypoint.sh)
        PassEnv HDIET_BADGE_KEY HDIET_SALT HDIET_REGISTRATION HDIET_BASE_URL
    </Directory>

    <Directory /server/web>
        Options -Indexes
        Require all granted
    </Directory>

    # Browsers also ask for /favicon.ico; the pages themselves link
    # figures/hdicon.ico, the same icon
    Alias /favicon.ico /server/web/hackdiet/online/figures/hdicon.ico

    RedirectMatch ^/$ /cgi-bin/HackDiet
</VirtualHost>
